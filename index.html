<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>911 Dispatch Radar Monitor</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --accent:#00ffc0;
  --alert:#ff4444;
  --shift:#00ff88;
}

body{
  margin:0;
  font-family:Consolas, monospace;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* TOP BUTTONS */
#fullscreen-btn,#settings-btn{
  position:fixed;
  top:10px;
  padding:8px 14px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  z-index:9999;
}

#fullscreen-btn{left:10px;background:var(--accent);}
#settings-btn{right:10px;background:var(--shift);}

/* SETTINGS PANEL */
#settings-panel{
  position:fixed;
  top:60px;
  right:10px;
  width:280px;
  background:#111;
  border:2px solid var(--accent);
  border-radius:10px;
  padding:15px;
  display:none;
  z-index:9999;
}

.setting{margin:10px 0;font-size:14px;}
.setting button{width:100%;padding:6px;margin-top:5px;cursor:pointer;}

/* EMERGENCY MODE */
#emergency-banner{
  position:fixed;
  bottom:0;
  width:100%;
  background:red;
  color:black;
  text-align:center;
  font-weight:bold;
  padding:8px;
  display:none;
  animation:flash 1s infinite;
}

body.emergency #emergency-banner{display:block;}

@keyframes flash{50%{opacity:.4;}}

/* LAYOUT */
#dashboard{
  display:grid;
  grid-template-columns:45% 55%;
  height:100vh;
}

/* LEFT PANEL */
#left{
  border-right:2px solid var(--accent);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

#clock{
  text-align:center;
}

#clock-time{
  font-size:5vw;
  text-shadow:0 0 20px var(--accent);
}

#clock-date{
  color:var(--accent);
}

/* SHIFT */
#shift{
  border:2px solid var(--shift);
  padding:15px;
  border-radius:10px;
  text-align:center;
}

#shift-time{font-size:2vw;}

/* ALERTS */
#warnings{
  border:2px solid var(--alert);
  padding:10px;
  border-radius:10px;
  height:40vh;
  overflow:auto;
}

/* RIGHT PANEL (RADAR) */
#right{
  display:flex;
  flex-direction:column;
}

#radar-title{
  padding:10px;
  background:#111;
  border-bottom:2px solid var(--accent);
  text-align:center;
  font-weight:bold;
}

#radar-frame{
  width:100%;
  height:100%;
  border:none;
}

/* TICKER */
#ticker{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#000;
  border-top:2px solid var(--accent);
  overflow:hidden;
}

#ticker-text{
  white-space:nowrap;
  display:inline-block;
  padding-left:100%;
  animation:scroll 25s linear infinite;
  color:var(--accent);
}

@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}
</style>
</head>

<body>

<button id="fullscreen-btn">FULLSCREEN</button>
<button id="settings-btn">SETTINGS</button>

<div id="settings-panel">
  <div class="setting">
    <button id="test-emergency">TEST EMERGENCY</button>
  </div>
</div>

<div id="emergency-banner">⚠️ EMERGENCY MODE ACTIVE ⚠️</div>

<div id="dashboard">

  <!-- LEFT -->
  <div id="left">

    <div id="clock">
      <div id="clock-time">00:00:00</div>
      <div id="clock-date">Loading...</div>
    </div>

    <div id="shift">
      <div>SHIFT TIMER</div>
      <div id="shift-time">--:--:--</div>
    </div>

    <div id="warnings">
      Loading NOAA alerts...
    </div>

  </div>

  <!-- RIGHT -->
  <div id="right">
    <div id="radar-title">LIVE WEATHER RADAR — BEATRICE NE</div>
    <iframe id="radar-frame"></iframe>
  </div>

</div>

<!-- TICKER -->
<div id="ticker">
  <div id="ticker-text">Loading dispatch feed...</div>
</div>

<script>

/* ======================
   FULLSCREEN
====================== */
document.getElementById("fullscreen-btn").onclick = () => {
  document.documentElement.requestFullscreen();
};

/* SETTINGS */
document.getElementById("settings-btn").onclick = () => {
  const p = document.getElementById("settings-panel");
  p.style.display = (p.style.display === "block") ? "none" : "block";
};

/* EMERGENCY TEST */
document.getElementById("test-emergency").onclick = () => {
  document.body.classList.toggle("emergency");
};

/* ======================
   CLOCK
====================== */
function pad(n){return String(n).padStart(2,"0");}

function updateClock(){
  const now = new Date();

  document.getElementById("clock-time").textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  document.getElementById("clock-date").textContent =
    now.toDateString();
}

setInterval(updateClock,1000);
updateClock();

/* ======================
   SHIFT TIMER
====================== */
const SHIFT_START = "17:30";
const SHIFT_END = "05:30";

function updateShift(){
  const now = new Date();

  let [sh,sm] = SHIFT_START.split(":").map(Number);
  let [eh,em] = SHIFT_END.split(":").map(Number);

  let start = new Date(now);
  start.setHours(sh,sm,0,0);

  let end = new Date(now);
  end.setHours(eh,em,0,0);

  if(end <= start){
    if(now < end) start.setDate(start.getDate()-1);
    else end.setDate(end.getDate()+1);
  }

  const active = now>=start && now<=end;
  const diff = active ? end-now : start-now;

  const h = Math.floor(diff/3600000);
  const m = Math.floor(diff/60000%60);
  const s = Math.floor(diff/1000%60);

  document.getElementById("shift-time").textContent =
    `${pad(h)}:${pad(m)}:${pad(s)}`;
}

setInterval(updateShift,1000);
updateShift();

/* ======================
   WEATHER RADAR (WINDY)
====================== */
document.getElementById("radar-frame").src =
"https://embed.windy.com/embed2.html?lat=40.268&lon=-96.746&zoom=7&level=surface&overlay=radar&menu=&message=true";

/* ======================
   NOAA ALERTS
====================== */
async function loadAlerts(){
  try{
    const res = await fetch("https://api.weather.gov/alerts/active?area=NE");
    const data = await res.json();

    let html = "";

    if(!data.features.length){
      document.getElementById("warnings").innerHTML = "No active alerts.";
      document.body.classList.remove("emergency");
      return;
    }

    let emergency = false;

    data.features.slice(0,6).forEach(a=>{
      const p = a.properties;
      const event = p.event.toLowerCase();

      if(event.includes("tornado")) emergency = true;

      html += `
        <div style="border:1px solid #444;padding:8px;margin:6px 0;">
          <b>${p.event}</b><br>
          ${p.headline}<br>
          <small>Until: ${new Date(p.expires).toLocaleString()}</small>
        </div>
      `;
    });

    document.getElementById("warnings").innerHTML = html;

    if(emergency){
      document.body.classList.add("emergency");
    } else {
      document.body.classList.remove("emergency");
    }

  }catch(e){
    document.getElementById("warnings").innerHTML =
      "Weather service offline";
  }
}

loadAlerts();
setInterval(loadAlerts,300000);

/* ======================
   TICKER
====================== */
const feed = [
"I-80 westbound traffic normal",
"Beatrice weather monitoring active",
"NOAA radar updating every 5 min",
"Dispatch system operational"
];

function updateTicker(){
  document.getElementById("ticker-text").textContent =
    feed.join(" ⚫ ");
}

updateTicker();
setInterval(updateTicker,300000);

</script>

</body>
</html>
