<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dispatch Monitor</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --accent:#00ffc0;
  --alert:#ff3b3b;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Consolas, monospace;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* MAIN LAYOUT */
#grid{
  display:flex;
  height:100vh;
}

/* LEFT */
#left{
  width:40%;
  border-right:2px solid var(--accent);
  display:flex;
  flex-direction:column;
  padding:10px;
  gap:10px;
}

/* CLOCK */
#clock{
  text-align:center;
  border:1px solid #333;
  padding:10px;
}

#time{
  font-size:3.2vw;
  letter-spacing:2px;
  text-shadow:0 0 12px var(--accent);
}

#date{
  font-size:14px;
  color:var(--accent);
}

/* SPACE WEATHER */
#space{
  font-size:13px;
  margin-top:6px;
}

/* ALERTS */
#alerts{
  flex:1;
  overflow:auto;
  border:1px solid #333;
  padding:8px;
}

/* RIGHT */
#right{
  width:60%;
  display:flex;
  flex-direction:column;
}

/* RADAR */
#radar{
  height:60%;
  width:100%;
  border:none;
}

/* INFO PANEL */
#info{
  height:40%;
  border-top:2px solid var(--accent);
  padding:10px;
  overflow:auto;
  line-height:1.5em;
}

/* ALERT CARD */
.card{
  border:1px solid #333;
  margin:6px 0;
  padding:6px;
  font-size:13px;
}

.high{
  border-color:var(--alert);
  box-shadow:0 0 10px var(--alert);
}

/* =========================
   NASA EONET TICKER
========================= */
#eonet-ticker{
  position:fixed;
  bottom:0;
  width:100%;
  height:35px;
  background:#000;
  border-top:2px solid var(--accent);
  overflow:hidden;
  z-index:9999;
}

#eonet-text{
  white-space:nowrap;
  display:inline-block;
  padding-left:100%;
  animation:scroll-left 60s linear infinite;
  color:var(--accent);
  font-size:14px;
}

@keyframes scroll-left{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="grid">

  <!-- LEFT -->
  <div id="left">

    <div id="clock">
      <div id="time">00:00:00</div>
      <div id="date">Loading...</div>
      <div id="space">Loading space weather...</div>
    </div>

    <div id="alerts">Loading alerts...</div>

  </div>

  <!-- RIGHT -->
  <div id="right">

    <iframe id="radar"></iframe>

    <div id="info">
      <b>Region Focus:</b> Southeast Nebraska / Northeast Kansas<br/><br/>

      <div id="weather">Loading weather...</div><br/>
      <div id="spc">Loading risk...</div><br/>
      <div id="quake">Loading seismic...</div><br/>

      System Status: ACTIVE
    </div>

  </div>

</div>

<!-- EONET TICKER -->
<div id="eonet-ticker">
  <div id="eonet-text">Loading NASA EONET feed...</div>
</div>

<script>

/* =========================
   CLOCK
========================= */
function pad(n){return String(n).padStart(2,"0");}

function updateClock(){
  const now=new Date();

  document.getElementById("time").textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  document.getElementById("date").textContent =
    now.toDateString();
}

setInterval(updateClock,1000);
updateClock();

/* =========================
   SPACE WEATHER
========================= */
async function loadSpaceWeather(){
  try{
    const res = await fetch(
      "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
    );

    const data = await res.json();
    const latest = data[data.length - 1];

    const kp = parseFloat(latest.kp_index);

    let status = "QUIET";
    let color = "#00ffc0";

    if(kp >= 5){ status = "STORM WATCH"; color = "#ffb400"; }
    if(kp >= 7){ status = "SEVERE STORM"; color = "#ff3b3b"; }

    document.getElementById("space").textContent =
      `🛰️ Kp Index: ${kp.toFixed(2)} | ${status}`;

    document.getElementById("space").style.color = color;

  }catch(e){
    document.getElementById("space").textContent =
      "Space weather offline";
  }
}

/* =========================
   RADAR
========================= */
document.getElementById("radar").src =
"https://embed.windy.com/embed2.html?lat=39.9&lon=-96.4&zoom=7&level=surface&overlay=radar";

/* =========================
   NOAA ALERTS
========================= */
async function loadAlerts(){
  try{
    const res = await fetch("https://api.weather.gov/alerts/active?area=NE,KS");
    const data = await res.json();

    let html="";
    let emergency=false;

    (data.features||[]).slice(0,10).forEach(a=>{
      const p=a.properties;
      const event=(p.event||"").toLowerCase();

      const high =
        event.includes("tornado") ||
        p.severity==="Extreme";

      if(high) emergency=true;

      html+=`
        <div class="card ${high?"high":""}">
          <b>${p.event}</b><br/>
          ${p.headline || ""}<br/>
          <small>${p.areaDesc || ""}</small>
        </div>
      `;
    });

    document.getElementById("alerts").innerHTML=html;

    document.body.style.background = emergency ? "#120000" : "#000";

  }catch(e){
    document.getElementById("alerts").innerHTML="Weather offline";
  }
}

/* =========================
   WEATHER
========================= */
async function loadWeather(){
  try{
    const r = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=40.27&longitude=-96.75&current_weather=true"
    );
    const d = await r.json();
    const w = d.current_weather;

    document.getElementById("weather").innerHTML =
      `🌡️ Temp: ${w.temperature}° | 💨 Wind: ${w.windspeed} mph`;

  }catch(e){
    document.getElementById("weather").innerHTML="Weather offline";
  }
}

/* =========================
   SPC
========================= */
async function loadSPC(){
  try{
    await fetch("https://www.spc.noaa.gov/products/outlook/day1otlk.json");

    document.getElementById("spc").innerHTML =
      "🌪️ Severe Risk: ACTIVE (Day 1 Outlook)";
  }catch(e){
    document.getElementById("spc").innerHTML="SPC offline";
  }
}

/* =========================
   EARTHQUAKE
========================= */
async function loadQuake(){
  try{
    const r = await fetch(
      "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=1&orderby=time"
    );
    const d = await r.json();
    const q = d.features[0];

    document.getElementById("quake").innerHTML =
      `🌎 M${q.properties.mag} — ${q.properties.place}`;

  }catch(e){
    document.getElementById("quake").innerHTML="Seismic offline";
  }
}

/* =========================
   NASA EONET TICKER
========================= */
async function loadEONET(){
  try{
    const res = await fetch("https://eonet.gsfc.nasa.gov/api/v3/events");
    const data = await res.json();

    const events = data.events || [];

    const list = events.slice(0,8).map(e=>{
      const title = e.title || "Event";
      const cat = e.categories?.[0]?.title || "Incident";
      return `${cat}: ${title}`;
    });

    document.getElementById("eonet-text").textContent =
      "NASA EONET ⚫ " + list.join(" ⚫ ");

  }catch(e){
    document.getElementById("eonet-text").textContent =
      "NASA EONET offline";
  }
}

/* =========================
   RUN ALL
========================= */
loadAlerts();
loadWeather();
loadSPC();
loadQuake();
loadSpaceWeather();
loadEONET();

setInterval(loadAlerts,300000);
setInterval(loadWeather,300000);
setInterval(loadQuake,300000);
setInterval(loadSPC,3600000);
setInterval(loadSpaceWeather,60000);
setInterval(loadEONET,300000);

</script>

</body>
</html>
