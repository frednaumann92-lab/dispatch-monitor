<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ops Monitor — Beatrice NE</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --accent:#00ffc0;
  --alert:#ff3b3b;
  --json-color:#ff00ff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Consolas, monospace;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

#grid{
  display:flex;
  height: calc(100vh - 80px); 
}

/* LEFT */
#left{
  width:40%;
  border-right:2px solid var(--accent);
  display:flex;
  flex-direction:column;
  padding:10px;
  gap:10px;
}

/* CLOCK */
#clock{
  text-align:center;
  border:1px solid #333;
  padding:10px;
}

#time{
  font-size:3vw;
  text-shadow:0 0 10px var(--accent);
}

#date{
  color:var(--accent);
}

#space{
  font-size:13px;
  margin-top:5px;
}

/* THREAT */
#threat{
  border:1px solid #333;
  padding:8px;
  text-align:center;
}

/* ALERTS */
#alerts{
  flex:1;
  overflow:auto;
  border:1px solid #333;
  padding:8px;
}

/* RIGHT */
#right{
  width:60%;
  display:flex;
  flex-direction:column;
}

/* RADAR */
#radar{
  height:50%;
  width:100%;
  border:none;
}

/* INFO */
#info{
  height:25%;
  border-top:2px solid var(--accent);
  padding:10px;
  overflow:auto;
}

/* LIGHTNING */
#lightning{
  height:25%;
  border-top:2px solid var(--alert);
  padding:10px;
  overflow:auto;
}

.card{
  border:1px solid #333;
  margin:5px 0;
  padding:5px;
  font-size:13px;
}

/* =========================
    TICKER STYLES
========================= */
.ticker-wrap {
  position:fixed;
  width:100%;
  height:40px;
  background:#000;
  overflow:hidden;
  z-index:9999;
}

.ticker-text {
  white-space:nowrap;
  display:inline-block;
  padding-left:100%;
  animation:scroll-left 45s linear infinite;
  font-size:14px;
}

/* 🌍 NASA TICKER (Bottom) */
#nasa-bar{ bottom:0; border-top:2px solid var(--accent); }
#nasa-text{ color:var(--accent); }

/* 🧬 JSON TICKER (Above NASA) */
#json-bar{ bottom:40px; border-top:2px solid var(--json-color); background: rgba(0,0,0,0.9); }
#json-text{ color:var(--json-color); }

@keyframes scroll-left{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="grid">

<div id="left">
  <div id="clock">
    <div id="time">00:00:00</div>
    <div id="date">Loading...</div>
    <div id="space">Loading space weather...</div>
  </div>
  <div id="threat">
    THREAT INDEX: <span id="threatVal">0</span>/10
  </div>
  <div id="alerts">Loading alerts...</div>
</div>

<div id="right">
  <iframe id="radar"></iframe>
  <div id="info">
    <div id="weather">Loading weather...</div>
    <div id="iss">Loading ISS...</div>
    <div id="quake">Loading seismic...</div>
  </div>
  <div id="lightning">
    ⚡ Lightning Monitor<br>
    <div id="lightData">Loading lightning...</div>
  </div>
</div>

</div>

<div id="json-bar" class="ticker-wrap">
  <div id="json-text" class="ticker-text">Fetching Live Network JSON Feed...</div>
</div>

<div id="nasa-bar" class="ticker-wrap">
  <div id="nasa-text" class="ticker-text">Loading NASA EONET feed...</div>
</div>

<script>

function pad(n){return String(n).padStart(2,"0");}

/* CLOCK */
function clock(){
  const d=new Date();
  document.getElementById("time").textContent=
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById("date").textContent=d.toDateString();
}
setInterval(clock,1000);
clock();

/* SPACE WEATHER */
async function loadSpace(){
  try{
    const r = await fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json");
    const j = await r.json();
    const values = j.map(x => parseFloat(x.kp_index)).filter(v => Number.isFinite(v));
    const kp = values[values.length - 1];
    document.getElementById("space").textContent = `🛰️ Kp Index: ${kp.toFixed(2)}`;
  }catch(e){ document.getElementById("space").textContent = "🛰️ Space offline"; }
}

/* WEATHER */
async function loadWeather(){
  try{
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=40.2681&longitude=-96.7467&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph");
    const d = await r.json();
    const w = d.current_weather;
    document.getElementById("weather").innerHTML = `📍 Beatrice, NE<br>🌡️ Temp: ${w.temperature}°F<br>💨 Wind: ${w.windspeed} mph<br>🧭 Dir: ${w.winddirection}°`;
  }catch(e){ document.getElementById("weather").innerHTML = "Weather offline"; }
}

/* ISS */
async function loadISS(){
  try{
    const r = await fetch("https://api.wheretheiss.at/v1/satellites/25544");
    const d = await r.json();
    document.getElementById("iss").innerHTML = `🛰️ ISS Alt: ${Math.round(d.altitude)} km | Speed: ${Math.round(d.velocity)} km/h`;
  }catch(e){ document.getElementById("iss").innerHTML = "ISS offline"; }
}

/* LIGHTNING */
async function loadLightning(){
  try{
    const r = await fetch("https://map.blitzortung.org/map_data.json");
    const d = await r.json();
    const strikes = d?.flash_data?.length ?? 0;
    document.getElementById("lightData").textContent = `⚡ Active strikes: ${strikes}`;
  }catch(e){ document.getElementById("lightData").textContent = "⚡ Lightning offline"; }
}

/* NOAA ALERTS */
async function loadAlerts(){
  try{
    const r = await fetch("https://api.weather.gov/alerts/active?area=NE,KS", {headers:{"User-Agent":"ops-dashboard"}});
    const d = await r.json();
    let html="";
    (d.features || []).slice(0,8).forEach(a=>{
      const p = a.properties;
      html += `<div class="card"><b>${p.event || "Alert"}</b><br>${p.headline || ""}<br><small>${p.areaDesc || ""}</small></div>`;
    });
    document.getElementById("alerts").innerHTML = html || "No alerts";
  }catch(e){ document.getElementById("alerts").innerHTML = "Alerts offline"; }
}

/* SEISMIC */
async function loadQuake(){
  try{
    const r = await fetch("https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=1&orderby=time");
    const d = await r.json();
    const q = d.features[0];
    document.getElementById("quake").innerHTML = `🌎 M${q.properties.mag} — ${q.properties.place}`;
  }catch(e){ document.getElementById("quake").innerHTML = "Seismic offline"; }
}

/* NASA EONET */
async function loadNASA(){
  try{
    const r = await fetch("https://eonet.gsfc.nasa.gov/api/v3/events?status=open");
    const d = await r.json();
    const events = (d.events || []).slice(0,10);
    if(events.length === 0){
      document.getElementById("nasa-text").textContent = "🌍 NASA EONET: No active global events";
      return;
    }
    const text = events.map(e=>{
      const title = e.title || "Event";
      const cats = (e.categories || []).map(c=>c.title).join(", ");
      return `${title} (${cats})`;
    }).join(" ⚫ ");
    const el = document.getElementById("nasa-text");
    el.textContent = "🌍 NASA EONET: " + text;
    el.style.animation = "none"; void el.offsetWidth;
    el.style.animation = "scroll-left 45s linear infinite";
  }catch(e){ document.getElementById("nasa-text").textContent = "🌍 NASA feed offline"; }
}

/* ==================================
    🧬 DIRECT LOCAL JSON FETCH
================================== */
async function loadJsonFeed(){
  const el = document.getElementById("json-text");
  try {
    // Points directly to the local folder file shown in your directory structure
    const url = "ops-feed.json";
    
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("HTTP error " + r.status);
    const d = await r.json();
    
    if(d && d.messages && d.messages.length > 0) {
      el.textContent = "📡 OPS FEED: " + d.messages.join(" ⚪ ");
    } else {
      el.textContent = "📡 OPS FEED: No logs inside JSON file.";
    }
  } catch(e) {
    el.textContent = "📡 JSON FEED OFFLINE (Check File Name)";
    console.log("JSON Fetch Fail: ", e);
  }

  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "scroll-left 40s linear infinite";
}

/* RADAR */
document.getElementById("radar").src = "https://embed.windy.com/embed2.html?lat=39.9&lon=-96.4&zoom=7&overlay=radar";

/* RUN SYSTEM */
loadSpace();
loadWeather();
loadISS();
loadLightning();
loadAlerts();
loadQuake();
loadNASA();
loadJsonFeed();

setInterval(loadSpace,60000);
setInterval(loadWeather,60000);
setInterval(loadISS,30000);
setInterval(loadLightning,60000);
setInterval(loadAlerts,300000);
setInterval(loadQuake,300000);
setInterval(loadNASA,300000);
setInterval(loadJsonFeed,60000);

</script>

</body>
</html>
